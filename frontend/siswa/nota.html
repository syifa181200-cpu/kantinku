<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Struk Digital Pesanan - KantinKu</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; }
        .receipt-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            border: 1px solid #e2e8f0;
            max-width: 520px;
            margin: 40px auto;
        }
        .receipt-header {
            border-bottom: 2px dashed #cbd5e1;
            padding-bottom: 20px;
        }
        @media print {
            .no-print { display: none !important; }
            body { background: white; }
            .receipt-card { box-shadow: none; border: none; margin: 0; width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="receipt-card p-4 p-md-5">
        <div class="receipt-header text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-danger bg-opacity-10 text-danger rounded-circle mb-2" style="width: 50px; height: 50px;">
                <i class="bi bi-shop fs-3"></i>
            </div>
            <h4 class="fw-bold text-dark mb-0">KantinKu UMKM</h4>
            <small class="text-muted d-block">Kantor Dapur Mitra UMKM Sekolah</small>
            <div class="mt-3">
                <span class="badge bg-light text-dark border px-3 py-2 fs-6 nota-kode">#ORD-000</span>
            </div>
        </div>

        <div class="row g-2 mb-4 small">
            <div class="col-6">
                <span class="text-muted d-block">Tanggal Transaksi:</span>
                <strong class="text-dark nota-tanggal">-</strong>
            </div>
            <div class="col-6 text-end">
                <span class="text-muted d-block">Nama Pemesan:</span>
                <strong class="text-dark nota-pemesan">-</strong>
            </div>
            <div class="col-6">
                <span class="text-muted d-block">Metode Bayar:</span>
                <strong class="text-dark nota-metode">-</strong>
            </div>
            <div class="col-6 text-end">
                <span class="text-muted d-block">Status Pembayaran:</span>
                <span class="nota-pembayaran"></span>
            </div>
        </div>

        <table class="table table-borderless table-sm mb-4">
            <thead class="border-bottom">
                <tr class="text-muted small">
                    <th style="width: 40px;">#</th>
                    <th>Menu Pesanan</th>
                    <th class="text-center">Qty</th>
                    <th class="text-end">Subtotal</th>
                </tr>
            </thead>
            <tbody id="notaItemsTbody">
                <!-- Items populated dynamically -->
            </tbody>
        </table>

        <div class="border-top border-2 pt-3 mb-4">
            <div class="d-flex justify-content-between align-items-center">
                <span class="fw-bold text-dark fs-5">Total Pembayaran:</span>
                <span class="fw-bold text-primary fs-4 nota-total">Rp 0</span>
            </div>
            <div class="text-center mt-3">
                <span class="small text-muted">Status Pesanan Dapur:</span>
                <div class="mt-1 nota-status"></div>
            </div>
        </div>

        <div class="text-center text-muted small pt-3 border-top no-print">
            <p class="mb-3">Tunjukkan struk ini kepada petugas kantin saat mengambil makanan.</p>
            <div class="d-flex justify-content-center gap-2">
                <button onclick="window.print()" class="btn btn-outline-dark btn-sm rounded-pill px-3">
                    <i class="bi bi-printer me-1"></i> Cetak / Simpan PDF
                </button>
                <a href="index.html" class="btn btn-food-primary btn-sm rounded-pill px-3">
                    <i class="bi bi-arrow-left me-1"></i> Kembali ke Dashboard
                </a>
            </div>
        </div>
    </div>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/app.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        initNotaPage();
    });
</script>
</body>
</html>
